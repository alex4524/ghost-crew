name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check every ghost file
        run: node core/bin/ghost-crew.js check app-poltergeist/ghosts app-phantom-form/ghosts
      - name: Check design token contrast
        run: node scripts/contrast.mjs
      - name: Unit, MCP and end-to-end tests (uses the runner's Google Chrome)
        run: npm test
